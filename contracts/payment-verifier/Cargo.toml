[package]
name = "payment-verifier"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "22.0.0"
ed25519-dalek = "=2.2.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
lto = true
debug = 0
strip = "symbols"
codegen-units = 1
panic = "abort"
overflow-checks = true

[features]
default = []
testutils = ["soroban-sdk/testutils"]
