<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="url(#accent)" stroke-width="3"/>

  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.2"/>

  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="26" fill="url(#accent)"/>
    <line x1="0" y1="-26" x2="0" y2="-100" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <line x1="26" y1="0" x2="100" y2="0" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <line x1="-26" y1="0" x2="-100" y2="0" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <line x1="18" y1="-18" x2="70" y2="-70" stroke="url(#accent-light)" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="-18" y1="-18" x2="-70" y2="-70" stroke="url(#accent-light)" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="18" y1="18" x2="70" y2="70" stroke="url(#accent-light)" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="-18" y1="18" x2="-70" y2="70" stroke="url(#accent-light)" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
    <circle cx="0" cy="-100" r="13" fill="url(#accent)"/>
    <circle cx="100" cy="0" r="13" fill="url(#accent)"/>
    <circle cx="-100" cy="0" r="13" fill="url(#accent)"/>
    <circle cx="70" cy="-70" r="9" fill="url(#accent-light)" opacity="0.7"/>
    <circle cx="-70" cy="-70" r="9" fill="url(#accent-light)" opacity="0.7"/>
    <circle cx="70" cy="70" r="9" fill="url(#accent-light)" opacity="0.7"/>
    <circle cx="-70" cy="70" r="9" fill="url(#accent-light)" opacity="0.7"/>
  </g>
</svg>
