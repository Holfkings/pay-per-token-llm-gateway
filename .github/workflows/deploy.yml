name: Deploy

on:
  push:
    tags:
      - 'v*'

env:
  PNPM_VERSION: latest
  NODE_VERSION: '20'

jobs:
  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build & push gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.gateway
          push: true
          tags: |
            x402/gateway:latest
            x402/gateway:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.dashboard
          push: true
          tags: |
            x402/dashboard:latest
            x402/dashboard:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_contracts:
    name: Deploy Soroban Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      - name: Install Soroban CLI
        run: cargo install --locked stellar-cli --features opt

      - name: Build contracts
        run: |
          for contract in payment-verifier credit-escrow multisig; do
            cd contracts/$contract
            stellar contract build
            cd ../../
          done

      - name: Deploy to Testnet
        run: |
          stellar network add testnet --rpc-url https://soroban-testnet.stellar.org --network-passphrase "Test SDF Network ; September 2015"
          echo "Contract deployment would be configured with ${{ secrets.STELLAR_SECRET_KEY }}"
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
