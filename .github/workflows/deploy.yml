name: Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  PNPM_VERSION: latest
  STELLAR_CLI_VERSION: '27.1.0'

jobs:
  check-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    steps:
      - name: Check latest CI run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONCLUSION=$(gh run list --workflow CI --branch main --limit 1 --json conclusion --jq '.[0].conclusion')
          if [ "$CONCLUSION" != "success" ]; then
            echo "Latest CI run on main: $CONCLUSION — aborting deploy"
            exit 1
          fi
          echo "CI passed on main, proceeding with deploy"

  docker:
    needs: [check-ci]
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build & push gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.gateway
          push: true
          tags: |
            x402/gateway:latest
            x402/gateway:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.dashboard
          push: true
          tags: |
            x402/dashboard:latest
            x402/dashboard:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_contracts:
    needs: [check-ci]
    name: Deploy Soroban Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/*/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.toml') }}

      - name: Download Stellar CLI (pre-built)
        run: |
          curl -sL -o /tmp/stellar.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/stellar.tar.gz -C /tmp
          chmod +x /tmp/stellar
          sudo mv /tmp/stellar /usr/local/bin/stellar
          stellar --version

      - name: Configure Stellar testnet
        run: |
          stellar network add testnet \
            --rpc-url https://soroban-testnet.stellar.org \
            --network-passphrase "Test SDF Network ; September 2015"

      - name: Build and deploy contracts
        run: |
          STELLAR_SECRET="${{ secrets.STELLAR_SECRET_KEY }}"
          if [ -z "$STELLAR_SECRET" ]; then
            echo "⚠  STELLAR_SECRET_KEY not set — skipping contract deployment"
            exit 0
          fi

          for contract in payment-verifier credit-escrow multisig; do
            echo "Building $contract..."
            cd contracts/$contract
            stellar contract build

            echo "Deploying $contract to testnet..."
            CONTRACT_ID=$(stellar contract deploy \
              --wasm target/wasm32-unknown-unknown/release/${contract//-/_}.wasm \
              --source-account "$STELLAR_SECRET" \
              --network testnet 2>&1 | tail -1)
            echo "$contract deployed at: $CONTRACT_ID"

            cd ../../
          done
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
